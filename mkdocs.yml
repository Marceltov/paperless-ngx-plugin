site_name: paperless-plugin
site_description: A Claude Code plugin with skills for your Paperless-ngx documents, on top of the paperless-mcp server.
site_url: https://paperless-plugin.marceltov.de/
repo_url: https://github.com/Marceltov/paperless-plugin
repo_name: Marceltov/paperless-plugin
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Marcel Bruckner. Licensed under <a href="https://github.com/Marceltov/paperless-plugin/blob/main/LICENSE">MIT</a>

# Planning notes are local-only.
exclude_docs: |
  superpowers/

nav:
  - Home: index.md
  - Install and connect: install.md
  - Multiple instances: multiple-instances.md
  - Skills: skills.md

theme:
  name: material
  icon:
    logo: material/file-document-multiple-outline
  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.instant
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
